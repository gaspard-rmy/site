<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaspard Rémy</title>
  <meta name="description" content="Gaspard Rémy, étudiant en cinéma et technicien audiovisuel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=League+Spartan:wght@700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/projects.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="hero" id="top">
      <div class="hero-inner">
        <h1 id="name"></h1>
        <p class="tagline" id="tagline"></p>
        <div class="actions">
          <a class="btn btn-primary" href="#projects">Voir mes projets</a>
          <a class="btn btn-ghost" id="contact" href="#contact-section">Me contacter</a>
        </div>
      </div>
    </header>

    <section class="section" id="about">
      <div class="about-grid">
        <div class="about-photos" id="about-photos"></div>
        <div>
          <h2>Bio</h2>
          <div id="about-text"></div>
        </div>
      </div>
    </section>

    <section class="section alt" id="experience">
      <h2>Études</h2>
      <div class="timeline" id="experience-list"></div>
    </section>

    <section class="section alt" id="projects">
      <h2>Mes projets</h2>
      <p class="lead" id="featured-lead"></p>
      <div class="cards" id="featured-list"></div>
    </section>

    <section class="section alt" id="other">
      <h2>Mon travail</h2>
      <p class="lead" id="other-lead"></p>
      <div class="rows" id="other-list"></div>
    </section>

    <section class="section alt" id="skills">
      <h2>Compétences</h2>
      <ul class="chips" id="skills-list"></ul>
    </section>

    <section class="dark" id="inspirations">
      <div class="dark-inner">
        <h2>Mes inspirations</h2>
        <p class="quote" id="insp-lead"></p>
        <div class="films" id="insp-list"></div>
      </div>
    </section>

    <section class="section" id="contact-section">
      <h2>Contactez-moi</h2>
      <div class="contact">
        <p class="mail" id="mail"></p>
        <div class="socials" id="socials"></div>
      </div>
    </section>

    <footer class="footer">
      <span id="footer-text"></span>
    </footer>
  </main>
</body>
</html>
